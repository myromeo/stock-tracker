version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stock_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpass}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockuser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build: ./ingestion
    container_name: stock_ingestion
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      SYMBOLS: ${SYMBOLS:-AAPL,MSFT,GOOGL}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stockuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpass}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
      # Free tier = 5 calls/min, 500/day. Keep this conservative.
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-15}

  prediction:
    build: ./prediction
    container_name: stock_prediction
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stockuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpass}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
      SYMBOLS: ${SYMBOLS:-AAPL,MSFT,GOOGL}
      FORECAST_DAYS: ${FORECAST_DAYS:-14}
      RETRAIN_INTERVAL_HOURS: ${RETRAIN_INTERVAL_HOURS:-6}

  api:
    build: ./api
    container_name: stock_api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stockuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpass}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
    ports:
      - "8000:8000"

  dashboard:
    build: ./dashboard
    container_name: stock_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"

volumes:
  timescale_data:
